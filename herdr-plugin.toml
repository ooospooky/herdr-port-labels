id = "ooospooky.port-labels"
name = "Port Labels"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "See which herdr Space, tab, and pane has a dev server running: ⚡ on the tab, the port on the pane border, and the ports of each Space in the sidebar"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/with-node.sh", "--version"]

[[startup]]
command = ["sh", "scripts/with-node.sh", "src/ensure-watch.ts"]

[[events]]
on = "pane.created"
command = ["sh", "scripts/with-node.sh", "src/ensure-watch.ts"]

[[actions]]
id = "servers"
title = "Jump to a dev server"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin ooospooky.port-labels --entrypoint servers --focus"]

[[panes]]
id = "servers"
title = "Dev servers"
placement = "popup"
command = ["sh", "scripts/with-node.sh", "src/servers-popup.ts"]
